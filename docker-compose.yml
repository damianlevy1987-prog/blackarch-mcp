services:
  blackarch-mcp:
    build: .
    container_name: blackarch-mcp-server
    # stdio-only JSON-RPC server: attach with `docker run -i`, no ports.
    stdin_open: true
    volumes:
      - ./blackarch_full_db.json:/app/blackarch_full_db.json:ro
    environment:
      - BLACKARCH_DB=/app/blackarch_full_db.json
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import json; open('/app/blackarch_full_db.json').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  blackarch-web:
    build: .
    container_name: blackarch-web
    ports:
      - "8081:8080"
    command: ["python3", "/app/blackarch_web.py"]
    volumes:
      - ./blackarch_full_db.json:/app/blackarch_full_db.json:ro
    environment:
      - PORT=8080
    restart: unless-stopped

networks:
  default:
    name: blackarch-network