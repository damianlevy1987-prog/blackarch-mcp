name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check
        run: |
          for f in *.py; do
            python3 -m py_compile "$f"
          done

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n blackarch.sh

      - name: JSON validity
        run: |
          python3 -m json.tool blackarch_full_db.json > /dev/null
          python3 -m json.tool blackarch_mcp.json > /dev/null

      - name: MCP handshake test
        run: python3 verify_mcp.py

      - name: Test suite
        run: python3 test_blackarch.py
